<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PI MINER GOLD RUSH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Roboto", "Microsoft YaHei", sans-serif;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    color: #F7931A;
    text-shadow: 0 0 12px rgba(247, 147, 26, 0.6), 2px 2px 4px rgba(0,0,0,0.6);
    margin-bottom: 8px;
    letter-spacing: 2px;
    font-size: clamp(20px, 4.5vw, 30px);
  }
  #topBar {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ctrl-btn {
    background: rgba(30, 27, 75, 0.85);
    border: 1px solid #F7931A;
    color: #F7931A;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s, transform 0.1s;
  }
  .ctrl-btn:hover { background: rgba(247, 147, 26, 0.2); transform: scale(1.04); }
  .ctrl-btn.active { background: #F7931A; color: #1a1a2e; }
  #gameWrap {
    position: relative;
    border: 3px solid #F7931A;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(247, 147, 26, 0.35), 0 10px 40px rgba(0,0,0,0.6);
    background: #1a1a2e;
    max-width: 100vw;
    max-height: 72vh;
  }
  canvas {
    display: block;
    border-radius: 6px;
    cursor: pointer;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.78);
    border-radius: 6px;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .panel {
    background: linear-gradient(145deg, #1e1b4b 0%, #312e81 100%);
    padding: 24px 32px;
    border-radius: 14px;
    border: 2px solid #F7931A;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(247, 147, 26, 0.2);
    max-width: 92vw;
  }
  .panel h2 {
    color: #F7931A;
    margin-bottom: 12px;
    font-size: clamp(22px, 5.5vw, 28px);
  }
  .panel p { margin: 7px 0; font-size: 15px; color: #e0e7ff; }
  .panel button {
    margin-top: 16px;
    padding: 11px 32px;
    font-size: 16px;
    background: linear-gradient(135deg, #F7931A, #e07b00);
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 4px 12px rgba(247, 147, 26, 0.4);
  }
  .panel button:hover { transform: scale(1.05); box-shadow: 0 6px 16px rgba(247, 147, 26, 0.55); }
  .panel button:active { transform: scale(0.97); }
  #tip {
    margin-top: 10px;
    color: #a5b4fc;
    font-size: 12px;
    text-align: center;
    padding: 0 12px;
  }
  .paf-made-by {
    position: fixed;
    right: 8px;
    bottom: 8px;
    width: min(72px, 12vw);
    max-width: 12vw;
    height: auto;
    object-fit: contain;
    opacity: 0.5;
    pointer-events: none;
    z-index: 30;
  }
  @media (max-width: 820px) {
    h1 { font-size: 18px; letter-spacing: 1px; margin-bottom: 4px; }
    #tip { font-size: 11px; }
    .panel { padding: 18px 20px; }
    .ctrl-btn { padding: 5px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<!--
  PI MINER GOLD RUSH
  Adapted from "黄金矿工 Gold Miner" by HelloWorldTjy (MIT)
  https://github.com/HelloWorldTjy/gold-miner
  Virtual Pi points only — no real crypto mining or transfers.
-->
<h1>⛏️ PI MINER GOLD RUSH ⛏️</h1>
<div id="topBar">
  <button class="ctrl-btn" id="btnLang" title="Language / Ngôn ngữ">🌐 EN / VI</button>
  <button class="ctrl-btn" id="btnMute" title="Sound">🔊 Sound</button>
</div>
<div id="gameWrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="overlay">
    <div class="panel" id="panel"></div>
  </div>
</div>
<div id="tip">Tap · Space · ↓  →  Drop hook & collect Pi</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const tipEl = document.getElementById('tip');
  const btnLang = document.getElementById('btnLang');
  const btnMute = document.getElementById('btnMute');

  const W = canvas.width, H = canvas.height;
  const MINER_X = W / 2, MINER_Y = 110;
  const SWING_RANGE = Math.PI * 0.42;

  const PI_ORANGE = '#F7931A';
  const PI_ORANGE_DARK = '#c77700';
  const PI_PURPLE = '#7C3AED';
  const PI_PURPLE_LIGHT = '#A78BFA';

  // ========== i18n ==========
  let lang = localStorage.getItem('pmgr_lang') || 'vi';
  const T = {
    vi: {
      title: 'PI MINER GOLD RUSH',
      startTitle: '⛏️ PI MINER GOLD RUSH',
      startSub: 'Đào Pi ảo · Virtual Pi Points',
      startDesc: 'Thả móc câu để thu thập <strong style="color:#F7931A">đồng Pi</strong>!',
      startHint: '💎 Pi Crystal quý nhất · 🟠 Pi lớn giá trị cao · 🪨 Đá rất nặng',
      startCtrl: 'Chạm màn hình · Space · ↓',
      startBtn: '🚀 Bắt đầu đào Pi',
      level: 'LEVEL',
      score: 'Điểm Pi',
      target: 'Mục tiêu',
      winTitle: '🎉 Vượt ải thành công!',
      winLevel: 'Level',
      winDone: 'hoàn thành',
      winNext: 'Mục tiêu tăng dần · 12 màn chơi',
      nextBtn: 'Level tiếp theo',
      loseTitle: '⏰ Hết giờ!',
      loseScore: 'Bạn đạt',
      losePoints: 'điểm',
      loseRetry: 'Thử lại để đào được nhiều Pi hơn!',
      retryBtn: 'Chơi lại',
      tip: 'Chạm màn hình · Space · ↓  →  Thả móc câu & thu thập Pi',
      soundOn: '🔊 Sound',
      soundOff: '🔇 Muted',
      langBtn: '🌐 VI / EN',
      pulling: 'Kéo...!',
      heavy: 'Nặng quá!',
      nice: 'Tuyệt!',
      bigPi: 'Pi lớn', midPi: 'Pi vừa', smallPi: 'Pi nhỏ',
      bigRock: 'Đá lớn', smallRock: 'Đá nhỏ',
      diamond: 'Pi Crystal', bag: 'Túi bí ẩn'
    },
    en: {
      title: 'PI MINER GOLD RUSH',
      startTitle: '⛏️ PI MINER GOLD RUSH',
      startSub: 'Mine virtual Pi · Virtual Pi Points',
      startDesc: 'Drop the hook to collect <strong style="color:#F7931A">Pi coins</strong>!',
      startHint: '💎 Pi Crystal most valuable · 🟠 Big Pi high value · 🪨 Rocks are heavy',
      startCtrl: 'Tap screen · Space · ↓',
      startBtn: '🚀 Start Mining Pi',
      level: 'LEVEL',
      score: 'Pi Score',
      target: 'Target',
      winTitle: '🎉 Level Cleared!',
      winLevel: 'Level',
      winDone: 'complete',
      winNext: 'Rising targets · 12 stages',
      nextBtn: 'Next Level',
      loseTitle: '⏰ Time Up!',
      loseScore: 'You scored',
      losePoints: 'points',
      loseRetry: 'Try again to mine more Pi!',
      retryBtn: 'Play Again',
      tip: 'Tap · Space · ↓  →  Drop hook & collect Pi',
      soundOn: '🔊 Sound',
      soundOff: '🔇 Muted',
      langBtn: '🌐 EN / VI',
      pulling: 'Pulling...!',
      heavy: 'So heavy!',
      nice: 'Nice!',
      bigPi: 'Big Pi', midPi: 'Mid Pi', smallPi: 'Small Pi',
      bigRock: 'Big Rock', smallRock: 'Small Rock',
      diamond: 'Pi Crystal', bag: 'Mystery Bag'
    }
  };
  function t(key) { return (T[lang] && T[lang][key]) || T.en[key] || key; }

  // ========== ITEM TYPES ==========
  const ITEM_TYPES = {
    bigPi:     { nameKey: 'bigPi',     color: PI_ORANGE, value: 500, weight: 7,  radius: 38 },
    midPi:     { nameKey: 'midPi',     color: '#FFB347', value: 250, weight: 4,  radius: 26 },
    smallPi:   { nameKey: 'smallPi',   color: '#FFD580', value: 100, weight: 2,  radius: 16 },
    bigRock:   { nameKey: 'bigRock',   color: '#64748B', value: 11,  weight: 10, radius: 42 },
    smallRock: { nameKey: 'smallRock', color: '#94A3B8', value: 1,   weight: 4,  radius: 22 },
    diamond:   { nameKey: 'diamond',   color: '#22D3EE', value: 600, weight: 1,  radius: 14 },
    bag:       { nameKey: 'bag',       color: '#6D28D9', value: 0,   weight: 3,  radius: 20 }
  };

  let level = 1, score = 0, target = 500, timeLeft = 60, gameState = 'menu';
  let items = [];
  let particles = [];
  let sweat = [];
  let lastTime = 0;
  let flashAlpha = 0;
  let minerAnim = 0; // 0..1 strain intensity
  let minerLean = 0;
  let faceStrain = 0;
  let crankAngle = 0; // hand winch rotation
  // Fatigue / mood system
  let fatigue = 0;           // 0..100
  let mood = 'happy';        // happy | working | tired | grumpy | resting | recovering
  let restTimer = 0;
  let restNeeded = 4.5;      // seconds to fully recover
  let bobPhase = 0;          // idle body bob
  let lastMoodMsg = 0;
  let moodMsg = '';
  let moodMsgLife = 0;

  const hook = {
    angle: 0, swingDir: 1, swingSpeed: 1.6,
    length: 30, baseLength: 30, state: 'swinging',
    extendSpeed: 520, retractSpeed: 520,
    grabbed: null, grabbedOffset: 0
  };

  // ========== AUDIO (real OGG samples + mute) ==========
  let muted = localStorage.getItem('pmgr_muted') === '1';
  const SFX = {};
  let bgmEl = null;
  let lastGrunt = 0;

  function loadSound(name, loop) {
    const a = new Audio('sounds/' + name + '.ogg');
    a.preload = 'auto';
    a.loop = !!loop;
    a.volume = loop ? 0.28 : 0.55;
    return a;
  }

  function initSounds() {
    if (Object.keys(SFX).length) return;
    try {
      SFX.drop = loadSound('drop');
      SFX.hit = loadSound('hit');
      SFX.collect = loadSound('collect');
      SFX.win = loadSound('win');
      SFX.lose = loadSound('lose');
      SFX.grunt = loadSound('grunt');
      SFX.gruntShort = loadSound('grunt_short');
      bgmEl = loadSound('bgm', true);
      bgmEl.volume = 0.22;
    } catch (e) { console.warn('audio load', e); }
  }

  function play(name, vol) {
    if (muted) return;
    initSounds();
    const a = SFX[name];
    if (!a) return;
    try {
      a.pause();
      a.currentTime = 0;
      if (vol != null) a.volume = vol;
      a.play().catch(() => {});
    } catch (e) {}
  }

  function sfxDrop() { play('drop', 0.5); }
  function sfxHit() { play('hit', 0.55); }
  function sfxCollect(v) { play('collect', 0.5); }
  function sfxWin() { play('win', 0.55); }
  function sfxLose() { play('lose', 0.5); }
  function sfxTick() { /* optional short tick kept silent to avoid spam */ }
  function sfxGrunt(heavy) {
    if (muted) return;
    const now = performance.now();
    if (now - lastGrunt < (heavy ? 380 : 520)) return;
    lastGrunt = now;
    play(heavy ? 'grunt' : 'gruntShort', heavy ? 0.6 : 0.45);
  }

  function startBgm() {
    if (muted) return;
    initSounds();
    if (!bgmEl) return;
    try {
      bgmEl.currentTime = 0;
      bgmEl.play().catch(() => {});
    } catch (e) {}
  }
  function stopBgm() {
    if (bgmEl) {
      try { bgmEl.pause(); bgmEl.currentTime = 0; } catch (e) {}
    }
  }

  function updateMuteBtn() {

    btnMute.textContent = muted ? t('soundOff') : t('soundOn');
    btnMute.classList.toggle('active', !muted);
  }
  function updateLangBtn() {
    btnLang.textContent = t('langBtn');
  }

  btnMute.onclick = () => {
    muted = !muted;
    localStorage.setItem('pmgr_muted', muted ? '1' : '0');
    updateMuteBtn();
    if (muted) stopBgm();
    else if (gameState === 'playing') startBgm();
    initSounds();
  };
  btnLang.onclick = () => {
    lang = lang === 'vi' ? 'en' : 'vi';
    localStorage.setItem('pmgr_lang', lang);
    applyLang();
  };

  function applyLang() {
    document.title = t('title');
    tipEl.textContent = t('tip');
    updateMuteBtn();
    updateLangBtn();
    if (gameState === 'menu') showStartScreen();
  }

  // ========== INIT ==========
  function startGame() {
    level = 1; score = 0;
    initLevel();
    startBgm();
  }

  function initLevel() {
    target = 500 + (level - 1) * 350 + Math.max(0, level - 6) * 80;
    // Slightly less time on deeper stages
    timeLeft = level <= 6 ? 60 : Math.max(45, 60 - (level - 6) * 2);
    items = []; particles = []; sweat = [];
    resetHook();
    gameState = 'playing';
    spawnItems();
    overlay.classList.remove('show');
    minerAnim = 0; minerLean = 0; faceStrain = 0; crankAngle = 0;
    fatigue = Math.max(0, fatigue * 0.35); // carry a bit of fatigue between levels
    if (fatigue < 40) mood = 'happy';
    restTimer = 0; moodMsg = ''; moodMsgLife = 0;
  }

  function resetHook() {
    hook.angle = 0; hook.swingDir = 1;
    hook.length = hook.baseLength;
    hook.state = 'swinging';
    hook.grabbed = null; hook.grabbedOffset = 0;
  }

  function spawnItems() {
    const layout = pickLayout();
    const placed = [];
    for (const cfg of layout) {
      const tdef = ITEM_TYPES[cfg.type];
      let attempts = 0, ok = false, x = 0, y = 0;
      while (attempts < 80 && !ok) {
        x = 60 + Math.random() * (W - 120);
        y = 230 + Math.random() * (H - 270);
        ok = true;
        for (const p of placed) {
          if (Math.hypot(x - p.x, y - p.y) < tdef.radius + p.radius + 8) { ok = false; break; }
        }
        attempts++;
      }
      placed.push({
        x, y, type: cfg.type, radius: tdef.radius,
        value: cfg.value !== undefined ? cfg.value : tdef.value,
        weight: tdef.weight, color: tdef.color,
        seed: Math.random() * Math.PI * 2, grabbed: false
      });
    }
    items = placed;
  }

  function pickLayout() {
    // 12 progressive stages — more rocks & bags, fewer easy Pi later
    const counts = {
      1:  { bigPi: 2, midPi: 3, smallPi: 5, bigRock: 1, smallRock: 2, diamond: 1, bag: 1 },
      2:  { bigPi: 2, midPi: 4, smallPi: 4, bigRock: 2, smallRock: 3, diamond: 1, bag: 1 },
      3:  { bigPi: 3, midPi: 3, smallPi: 4, bigRock: 2, smallRock: 3, diamond: 2, bag: 2 },
      4:  { bigPi: 3, midPi: 4, smallPi: 3, bigRock: 3, smallRock: 3, diamond: 2, bag: 2 },
      5:  { bigPi: 4, midPi: 3, smallPi: 3, bigRock: 3, smallRock: 4, diamond: 2, bag: 2 },
      6:  { bigPi: 3, midPi: 3, smallPi: 3, bigRock: 4, smallRock: 4, diamond: 2, bag: 2 },
      7:  { bigPi: 3, midPi: 2, smallPi: 3, bigRock: 4, smallRock: 5, diamond: 3, bag: 2 },
      8:  { bigPi: 2, midPi: 3, smallPi: 2, bigRock: 5, smallRock: 5, diamond: 3, bag: 3 },
      9:  { bigPi: 2, midPi: 2, smallPi: 2, bigRock: 5, smallRock: 6, diamond: 3, bag: 3 },
      10: { bigPi: 2, midPi: 2, smallPi: 2, bigRock: 6, smallRock: 6, diamond: 4, bag: 3 },
      11: { bigPi: 1, midPi: 2, smallPi: 2, bigRock: 6, smallRock: 7, diamond: 4, bag: 3 },
      12: { bigPi: 1, midPi: 2, smallPi: 1, bigRock: 7, smallRock: 7, diamond: 4, bag: 4 }
    };
    const c = counts[Math.min(level, 12)] || counts[12];
    const layout = [];
    for (const [type, n] of Object.entries(c)) {
      for (let i = 0; i < n; i++) {
        const entry = { type };
        if (type === 'bag') {
          entry.value = [50,100,150,200,300,400,500,600,800][Math.floor(Math.random()*9)];
        }
        layout.push(entry);
      }
    }
    return layout;
  }

  function hookTip() {
    return {
      x: MINER_X + Math.sin(hook.angle) * hook.length,
      y: MINER_Y + Math.cos(hook.angle) * hook.length
    };
  }

  function tryDrop() {
    if (gameState !== 'playing' || hook.state !== 'swinging') return;
    if (mood === 'resting' || mood === 'recovering' || mood === 'grumpy') {
      // Refuse while resting — humorous bubble
      moodMsg = lang === 'vi' ? 'Để nghỉ đã! 😤' : 'Let me rest! 😤';
      moodMsgLife = 1.4;
      return;
    }
    hook.state = 'extending';
    sfxDrop();
    mood = 'working';
  }

  canvas.addEventListener('click', tryDrop);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); tryDrop(); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); tryDrop(); }
  });

  // ========== UPDATE ==========
  function beginRest() {
    mood = 'grumpy';
    restTimer = 0;
    // Abort current haul safely — item returns to field if mid-pull
    if (hook.grabbed) {
      hook.grabbed.grabbed = false;
      hook.grabbed = null;
    }
    hook.state = 'swinging';
    hook.length = hook.baseLength;
    moodMsg = lang === 'vi' ? 'Mệt quá! Ngồi nghỉ cái đã 🪑' : 'Exhausted! Sitting down 🪑';
    moodMsgLife = 2.2;
    // mood transitions to resting via restTimer in update()
  }

  function update(dt) {
    if (gameState !== 'playing') return;

    bobPhase += dt;

    // Mood message timer
    if (moodMsgLife > 0) moodMsgLife -= dt;

    // Resting: pause level timer so player is not punished
    if (mood === 'resting' || mood === 'grumpy' || mood === 'recovering') {
      restTimer += dt;
      if (mood === 'grumpy' && restTimer > 0.6) mood = 'resting';
      if (mood === 'resting' && restTimer >= restNeeded) {
        mood = 'recovering';
        restTimer = 0;
        moodMsg = lang === 'vi' ? 'Khỏe lại rồi! 💪' : 'Feeling better! 💪';
        moodMsgLife = 1.6;
      }
      if (mood === 'recovering') {
        fatigue = Math.max(0, fatigue - dt * 55);
        if (fatigue <= 15) {
          fatigue = 0;
          mood = 'happy';
          moodMsg = lang === 'vi' ? 'Tiếp tục đào Pi nào!' : 'Back to mining Pi!';
          moodMsgLife = 1.4;
        }
      }
      // Still update particles / sweat decay lightly
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt; p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
      for (const s of sweat) {
        s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 180 * dt; s.life -= dt;
      }
      sweat = sweat.filter(s => s.life > 0);
      minerAnim = Math.max(0, minerAnim - dt * 2);
      return; // skip hook & timer while resting
    }

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endLevel(); return; }
    if (Math.floor(timeLeft) !== Math.floor(timeLeft + dt) && timeLeft <= 10) sfxTick();

    // Passive fatigue recovery while idle swinging
    if (hook.state === 'swinging' && fatigue > 0) {
      fatigue = Math.max(0, fatigue - dt * 3.5);
      if (fatigue < 40 && mood === 'tired') mood = 'happy';
    }

    // Miner strain animation + hand winch crank
    if (hook.state === 'retracting' && hook.grabbed) {
      const w = hook.grabbed.weight;
      minerAnim = Math.min(1, minerAnim + dt * (0.8 + w * 0.15));
      minerLean = Math.sin(performance.now() / 90) * (0.08 + w * 0.012);
      faceStrain = Math.min(1, faceStrain + dt * 1.2);
      // Crank speed depends on weight (heavier = slower turn)
      const crankSpeed = 6.5 / (1 + w * 0.12);
      crankAngle += crankSpeed * dt;
      // Sweat drops
      if (Math.random() < 0.35 + w * 0.04) {
        sweat.push({
          x: MINER_X + (Math.random() - 0.5) * 20,
          y: MINER_Y - 70 + Math.random() * 10,
          vx: (Math.random() - 0.5) * 30,
          vy: 40 + Math.random() * 40,
          life: 0.5 + Math.random() * 0.4,
          maxLife: 0.9
        });
      }
      // Real effort / groan voice while pulling
      if (Math.random() < 0.04 + w * 0.015) sfxGrunt(w >= 7);
    } else {
      minerAnim = Math.max(0, minerAnim - dt * 2.5);
      minerLean *= 0.9;
      faceStrain = Math.max(0, faceStrain - dt * 1.5);
    }

    if (hook.state === 'swinging') {
      hook.angle += hook.swingDir * hook.swingSpeed * dt;
      if (hook.angle > SWING_RANGE) { hook.angle = SWING_RANGE; hook.swingDir = -1; }
      else if (hook.angle < -SWING_RANGE) { hook.angle = -SWING_RANGE; hook.swingDir = 1; }
    } else if (hook.state === 'extending') {
      hook.length += hook.extendSpeed * dt;
      const tip = hookTip();
      if (tip.x < 0 || tip.x > W || tip.y > H - 10) { hook.state = 'retracting'; return; }
      for (const it of items) {
        if (it.grabbed) continue;
        if (Math.hypot(tip.x - it.x, tip.y - it.y) < it.radius) {
          it.grabbed = true;
          hook.grabbed = it;
          hook.grabbedOffset = it.radius * 0.6;
          hook.state = 'retracting';
          spawnHitParticles(tip.x, tip.y);
          sfxHit();
          break;
        }
      }
    } else if (hook.state === 'retracting') {
      const speedMul = hook.grabbed ? (1 / (1 + hook.grabbed.weight * 0.18)) : 1;
      hook.length -= hook.retractSpeed * speedMul * dt;
      if (hook.grabbed) {
        const tip = hookTip();
        hook.grabbed.x = tip.x + Math.sin(hook.angle) * hook.grabbedOffset;
        hook.grabbed.y = tip.y + Math.cos(hook.angle) * hook.grabbedOffset;
      }
      if (hook.length <= hook.baseLength) {
        hook.length = hook.baseLength;
        if (hook.grabbed) {
          const gained = hook.grabbed.value;
          const w = hook.grabbed.weight;
          score += gained;
          flashAlpha = 0.5;
          spawnScoreParticles(MINER_X, MINER_Y, '+' + gained);
          sfxCollect(gained);
          // Fatigue from haul (heavier & more valuable = more tired)
          fatigue = Math.min(100, fatigue + 8 + w * 2.2 + Math.min(12, gained / 80));
          if (fatigue >= 100) {
            beginRest();
          } else if (fatigue >= 70) {
            mood = 'tired';
            moodMsg = lang === 'vi' ? 'Hơi mệt rồi...' : 'Getting tired...';
            moodMsgLife = 1.5;
          } else {
            mood = 'happy';
            moodMsg = lang === 'vi' ? 'Tuyệt! ✨' : 'Nice! ✨';
            moodMsgLife = 0.9;
          }
          items = items.filter(it => it !== hook.grabbed);
          hook.grabbed = null;
        }
        hook.state = 'swinging';
      }
    }

    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    for (const s of sweat) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 180 * dt; s.life -= dt;
    }
    sweat = sweat.filter(s => s.life > 0);

    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 1.5);
    if (score >= target && hook.state === 'swinging') endLevel();
  }

  function endLevel() {
    stopBgm();
    if (score >= target) {
      gameState = 'levelComplete';
      sfxWin();
      showPanel(`<h2>${t('winTitle')}</h2>
        <p>${t('winLevel')} ${level} ${t('winDone')}</p>
        <p>${t('score')}: <strong style="color:#F7931A">${score}</strong> / ${t('target')} ${target}</p>
        <p style="font-size:14px;color:#A78BFA;">${t('winNext')}</p>
        <button id="nextBtn">${t('nextBtn')}</button>`);
      document.getElementById('nextBtn').onclick = () => { level++; initLevel(); startBgm(); };
    } else {
      gameState = 'gameOver';
      sfxLose();
      showPanel(`<h2>${t('loseTitle')}</h2>
        <p>${t('loseScore')} <strong style="color:#F7931A">${score}</strong> ${t('losePoints')}</p>
        <p>${t('target')}: ${target}</p>
        <p style="font-size:14px;color:#94A3B8;">${t('loseRetry')}</p>
        <button id="retryBtn">${t('retryBtn')}</button>`);
      document.getElementById('retryBtn').onclick = () => startGame();
    }
  }

  function showPanel(html) {
    panel.innerHTML = html;
    overlay.classList.add('show');
  }

  function spawnHitParticles(x, y) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 80 + Math.random() * 120;
      particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 40,
        life: 0.4 + Math.random()*0.3, maxLife: 0.7, size: 2+Math.random()*3, color: PI_ORANGE });
    }
  }
  function spawnScoreParticles(x, y, text) {
    particles.push({ x, y: y - 40, vx: 0, vy: -60, life: 1, maxLife: 1, size: 20, color: PI_ORANGE, text });
  }

  // ========== DRAW ==========
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, 220);
    sky.addColorStop(0, '#0f0c29'); sky.addColorStop(0.5, '#1e1b4b'); sky.addColorStop(1, '#312e81');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 220);

    const glow = ctx.createRadialGradient(W/2, 210, 20, W/2, 210, 280);
    glow.addColorStop(0, 'rgba(124,58,237,0.25)'); glow.addColorStop(1, 'rgba(124,58,237,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, 220);

    const ground = ctx.createLinearGradient(0, 220, 0, H);
    ground.addColorStop(0, '#1e293b'); ground.addColorStop(0.4, '#0f172a'); ground.addColorStop(1, '#020617');
    ctx.fillStyle = ground; ctx.fillRect(0, 220, W, H - 220);

    ctx.fillStyle = '#334155'; ctx.fillRect(0, 216, W, 6);
    ctx.fillStyle = PI_ORANGE; ctx.globalAlpha = 0.6; ctx.fillRect(0, 216, W, 2); ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(167,139,250,0.08)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,220); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 240; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    ctx.fillStyle = 'rgba(247,147,26,0.15)';
    for (let i = 0; i < 40; i++) {
      const x = (i * 97 + level * 13) % W;
      const y = 230 + ((i * 61) % (H - 240));
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawMiner() {
    const lean = minerLean;
    const strain = minerAnim;
    const cranking = (hook.state === 'retracting' && hook.grabbed);
    const sitting = (mood === 'resting' || mood === 'grumpy');
    const recovering = (mood === 'recovering');
    const wx = MINER_X + 52;
    const wy = MINER_Y - 30;
    const chairX = MINER_X - 95;
    const chairY = MINER_Y + 8;

    // === Platform ===
    ctx.fillStyle = '#334155';
    ctx.fillRect(MINER_X - 88, MINER_Y - 10, 176, 18);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(MINER_X - 88, MINER_Y + 4, 176, 5);
    ctx.fillStyle = PI_ORANGE;
    ctx.fillRect(MINER_X - 88, MINER_Y - 10, 176, 3);

    // === Chair (always visible near platform) ===
    ctx.fillStyle = '#78716c';
    ctx.fillRect(chairX - 18, chairY - 22, 36, 6); // seat
    ctx.fillRect(chairX - 16, chairY - 48, 6, 26); // back left
    ctx.fillRect(chairX + 10, chairY - 48, 6, 26); // back right
    ctx.fillRect(chairX - 18, chairY - 48, 36, 5); // top rail
    ctx.fillStyle = '#57534e';
    ctx.fillRect(chairX - 14, chairY - 16, 5, 20); // leg
    ctx.fillRect(chairX + 9, chairY - 16, 5, 20);

    // === Winch drum ===
    ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.ellipse(wx, wy, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(wx, wy, 15, 12, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#64748B';
    ctx.fillRect(wx - 3, wy - 18, 6, 10);
    ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.arc(wx, wy, 9 + i, -0.9, 0.9); ctx.stroke();
    }
    // Crank rotates when working
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(crankAngle);
    ctx.strokeStyle = '#F7931A'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -24); ctx.stroke();
    ctx.fillStyle = '#FDBA74';
    ctx.beginPath(); ctx.arc(0, -24, 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c77700'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -24, 7, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#94A3B8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 17); ctx.stroke();
    ctx.fillStyle = '#64748B';
    ctx.beginPath(); ctx.arc(0, 17, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#475569';
    ctx.fillRect(wx - 5, wy + 10, 10, MINER_Y - 10 - (wy + 10));

    // === Character ===
    const bob = (!cranking && !sitting) ? Math.sin(bobPhase * 3) * 1.5 : 0;

    if (sitting) {
      // Sitting pose on chair
      const sx = chairX;
      const sy = chairY - 28 + (mood === 'grumpy' ? Math.sin(bobPhase * 8) * 0.5 : 0);

      // Legs dangling
      ctx.fillStyle = '#312e81';
      ctx.fillRect(sx - 14, sy + 18, 10, 16);
      ctx.fillRect(sx + 4, sy + 18, 10, 16);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(sx - 14, sy + 30, 11, 6);
      ctx.fillRect(sx + 4, sy + 30, 11, 6);

      // Body slumped
      ctx.fillStyle = '#4C1D95';
      ctx.fillRect(sx - 16, sy - 8, 32, 28);
      // Crossed arms
      ctx.fillStyle = '#FDBA74';
      ctx.fillRect(sx - 22, sy + 2, 44, 9);
      ctx.fillStyle = PI_ORANGE;
      ctx.fillRect(sx - 8, sy - 2, 16, 10);

      // Head
      ctx.fillStyle = '#FDBA74';
      ctx.beginPath(); ctx.arc(sx, sy - 22, 15, 0, Math.PI * 2); ctx.fill();
      // Helmet tilted
      ctx.fillStyle = '#312e81';
      ctx.beginPath(); ctx.arc(sx - 2, sy - 26, 16, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PI_ORANGE;
      ctx.fillRect(sx - 18, sy - 28, 34, 3);

      // Grumpy face: furrowed brow, pout
      ctx.strokeStyle = '#5b21b6'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx - 9, sy - 28); ctx.lineTo(sx - 2, sy - 25);
      ctx.moveTo(sx + 9, sy - 28); ctx.lineTo(sx + 2, sy - 25);
      ctx.stroke();
      // Eyes half-closed angry
      ctx.fillStyle = '#000';
      ctx.fillRect(sx - 8, sy - 22, 5, 2);
      ctx.fillRect(sx + 3, sy - 22, 5, 2);
      // Pout
      ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy - 12, 4, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();

      // Zzz
      if (mood === 'resting') {
        ctx.fillStyle = 'rgba(167,139,250,0.9)';
        ctx.font = 'bold 14px "Segoe UI", sans-serif';
        const z = Math.sin(bobPhase * 2);
        ctx.fillText('z', sx + 18, sy - 40 - z * 4);
        ctx.font = 'bold 11px "Segoe UI", sans-serif';
        ctx.fillText('z', sx + 26, sy - 50 - z * 3);
      }
    } else {
      // Standing / working / recovering
      const x = MINER_X + lean * 12 + (recovering ? Math.sin(bobPhase * 10) * 2 : 0);
      const y = MINER_Y - 78 + bob;

      ctx.save();
      ctx.translate(x, y + 28);
      ctx.rotate(lean * 0.28 + (cranking ? Math.sin(performance.now() / 70) * 0.025 * strain : 0));

      // Legs
      const legSpread = cranking ? 0.15 : 0.05;
      ctx.fillStyle = '#312e81';
      ctx.save(); ctx.rotate(-legSpread);
      ctx.fillRect(-12, 28, 11, 22);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(-13, 46, 13, 6);
      ctx.restore();
      ctx.fillStyle = '#312e81';
      ctx.save(); ctx.rotate(legSpread);
      ctx.fillRect(2, 28, 11, 22);
      ctx.fillStyle = '#1e293b'; ctx.fillRect(1, 46, 13, 6);
      ctx.restore();

      // Body
      ctx.fillStyle = '#4C1D95';
      ctx.fillRect(-17, 0, 34, 34);
      ctx.fillStyle = PI_ORANGE;
      ctx.fillRect(-9, 6, 18, 11);
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(-6, 9, 12, 5);

      // Arms
      ctx.fillStyle = '#FDBA74';
      if (cranking) {
        // Left braces
        ctx.save();
        ctx.translate(-18, 10);
        ctx.rotate(-0.55 - strain * 0.2);
        ctx.fillRect(-4, 0, 9, 20);
        ctx.beginPath(); ctx.arc(0, 20, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        // Right cranks — synced to crankAngle
        ctx.save();
        ctx.translate(14, 4);
        const pump = Math.sin(crankAngle * 2) * 0.35;
        ctx.rotate(0.25 + 0.55 + pump);
        ctx.fillRect(-4, 0, 9, 26);
        ctx.beginPath(); ctx.arc(0, 26, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (recovering) {
        // Cheer arms up
        ctx.save(); ctx.translate(-16, 4); ctx.rotate(-0.9);
        ctx.fillRect(-4, 0, 9, 18); ctx.restore();
        ctx.save(); ctx.translate(16, 4); ctx.rotate(0.9);
        ctx.fillRect(-4, 0, 9, 18); ctx.restore();
      } else {
        ctx.fillRect(-26, 6, 9, 18);
        ctx.fillRect(17, 6, 9, 18);
      }

      // Head
      ctx.fillStyle = '#FDBA74';
      ctx.beginPath(); ctx.arc(0, -14, 15, 0, Math.PI * 2); ctx.fill();
      // Helmet
      ctx.fillStyle = '#312e81';
      ctx.beginPath(); ctx.arc(0, -18, 17, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PI_ORANGE;
      ctx.fillRect(-18, -20, 36, 3.5);
      // Visor color by mood
      let visor = 'rgba(34, 211, 238, 0.75)';
      if (mood === 'tired') visor = 'rgba(251, 191, 36, 0.8)';
      if (faceStrain > 0.4) visor = 'rgba(251, 146, 60, 0.85)';
      if (recovering) visor = 'rgba(74, 222, 128, 0.8)';
      ctx.fillStyle = visor;
      ctx.beginPath(); ctx.ellipse(0, -14, 11, 5.5, 0, 0, Math.PI * 2); ctx.fill();
      // Lamp
      ctx.fillStyle = '#FDE68A';
      ctx.beginPath(); ctx.arc(0, -27, 3.5, 0, Math.PI * 2); ctx.fill();

      // Face
      if (faceStrain > 0.35 || mood === 'tired') {
        ctx.fillStyle = '#7f1d1d';
        ctx.beginPath();
        ctx.ellipse(0, -6, 3.5 + faceStrain * 2, 2 + faceStrain * 1.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#5b21b6'; ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(-8, -20); ctx.lineTo(-2, -17);
        ctx.moveTo(8, -20); ctx.lineTo(2, -17);
        ctx.stroke();
      } else if (recovering || mood === 'happy') {
        // Smile
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(0, -7, 4, 0.15, Math.PI - 0.15); ctx.stroke();
        // Sparkle eyes
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(-5, -15, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(5, -15, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-4.3, -15.5, 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(5.7, -15.5, 0.7, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, -6, 3, 0, Math.PI); ctx.stroke();
      }

      ctx.restore();
    }

    // Effort / mood speech bubble
    if (cranking && minerAnim > 0.35) {
      ctx.fillStyle = PI_ORANGE;
      ctx.font = 'bold 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = Math.min(1, minerAnim);
      ctx.fillText(hook.grabbed && hook.grabbed.weight >= 7 ? t('heavy') : t('pulling'), MINER_X, MINER_Y - 112);
      ctx.globalAlpha = 1;
    }
    if (moodMsgLife > 0 && moodMsg) {
      ctx.globalAlpha = Math.min(1, moodMsgLife * 2);
      ctx.fillStyle = 'rgba(30,27,75,0.85)';
      const tw = ctx.measureText(moodMsg).width + 16;
      const mx = sitting ? chairX : MINER_X;
      const my = sitting ? chairY - 70 : MINER_Y - 125;
      ctx.fillRect(mx - tw / 2, my - 14, tw, 22);
      ctx.strokeStyle = PI_ORANGE; ctx.lineWidth = 1.5;
      ctx.strokeRect(mx - tw / 2, my - 14, tw, 22);
      ctx.fillStyle = '#E0E7FF';
      ctx.font = '12px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(moodMsg, mx, my);
      ctx.globalAlpha = 1;
    }

    // Fatigue bar (small, under HUD area on platform)
    if (gameState === 'playing') {
      const bw = 70, bh = 6;
      const bx = MINER_X - bw / 2, by = MINER_Y + 14;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      const fc = fatigue < 50 ? '#4ade80' : fatigue < 80 ? '#fbbf24' : '#f43f5e';
      ctx.fillStyle = fc;
      ctx.fillRect(bx, by, bw * (fatigue / 100), bh);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.strokeRect(bx, by, bw, bh);
    }
  }

  function drawHook() {
    const tip = hookTip();
    ctx.strokeStyle = '#94A3B8';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(MINER_X, MINER_Y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.save();
    ctx.translate(tip.x, tip.y);
    ctx.rotate(hook.angle);
    ctx.strokeStyle = '#CBD5E1';
    ctx.fillStyle = '#64748B';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-11, 0); ctx.lineTo(0, 17); ctx.lineTo(11, 0);
    ctx.stroke();
    ctx.fillRect(-7, -7, 14, 7);
    ctx.fillStyle = PI_ORANGE;
    ctx.beginPath(); ctx.arc(0, -3, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawItem(it) {
    ctx.save();
    ctx.translate(it.x, it.y);
    if (it.type === 'diamond') {
      const r = it.radius;
      ctx.fillStyle = it.color;
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r*0.7, 0); ctx.lineTo(0, r); ctx.lineTo(-r*0.7, 0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#67E8F9'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.moveTo(0, -r*0.5); ctx.lineTo(r*0.3, 0); ctx.lineTo(0, r*0.3); ctx.closePath(); ctx.fill();
    } else if (it.type === 'bag') {
      const r = it.radius;
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.ellipse(0, 2, r, r*1.05, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4C1D95'; ctx.fillRect(-r*0.7, -r, r*1.4, r*0.4);
      ctx.strokeStyle = PI_ORANGE; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r*0.5, -r*0.6); ctx.lineTo(r*0.5, -r*0.6); ctx.stroke();
      ctx.fillStyle = PI_ORANGE;
      ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('π', 0, 4);
    } else if (it.type.includes('Rock')) {
      const r = it.radius;
      ctx.fillStyle = it.color;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2;
        const rr = r * (0.85 + 0.15 * Math.sin(it.seed + i*1.7));
        const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(-r*0.3, -r*0.3, r*0.28, 0, Math.PI*2); ctx.fill();
    } else {
      const r = it.radius;
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = PI_ORANGE_DARK;
      ctx.beginPath(); ctx.arc(0, 0, r*0.78, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = Math.max(1.5, r*0.08);
      ctx.beginPath(); ctx.arc(0, 0, r*0.9, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#1a1a2e';
      ctx.font = `bold ${Math.floor(r*0.95)}px "Segoe UI", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('π', 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(-r*0.25, -r*0.35, r*0.28, r*0.18, -0.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      if (p.text) {
        ctx.fillStyle = p.color;
        ctx.font = `bold ${p.size}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // Sweat
    for (const s of sweat) {
      ctx.globalAlpha = s.life / s.maxLife;
      ctx.fillStyle = 'rgba(165, 243, 252, 0.9)';
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, 2.2, 3.5, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD() {
    if (gameState !== 'playing') return;
    ctx.fillStyle = 'rgba(15, 12, 41, 0.75)';
    ctx.fillRect(10, 10, 250, 82);
    ctx.strokeStyle = PI_ORANGE; ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, 250, 82);

    ctx.fillStyle = PI_ORANGE;
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`${t('level')} ${level}`, 22, 18);
    ctx.fillStyle = '#E0E7FF';
    ctx.font = '15px "Segoe UI", sans-serif';
    ctx.fillText(`${t('score')}: ${score}`, 22, 42);
    ctx.fillText(`${t('target')}: ${target}`, 22, 64);

    ctx.fillStyle = 'rgba(15, 12, 41, 0.75)';
    ctx.fillRect(W - 170, 10, 160, 50);
    ctx.strokeStyle = timeLeft <= 10 ? '#F43F5E' : PI_PURPLE_LIGHT;
    ctx.strokeRect(W - 170, 10, 160, 50);
    const tl = Math.max(0, Math.ceil(timeLeft));
    ctx.fillStyle = tl <= 10 ? '#F43F5E' : '#E0E7FF';
    ctx.font = 'bold 24px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`⏱ ${tl}s`, W - 90, 18);

    if (hook.grabbed) {
      const def = ITEM_TYPES[hook.grabbed.type];
      const name = t(def.nameKey);
      ctx.fillStyle = PI_ORANGE;
      ctx.font = 'bold 14px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${name} +${hook.grabbed.value}`, MINER_X, MINER_Y - 95);
    }
  }

  function render() {
    drawBackground();
    drawMiner();
    drawHook();
    for (const it of items) drawItem(it);
    drawParticles();
    drawHUD();
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(247, 147, 26, ${flashAlpha * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - lastTime) / 1000) || 0;
    lastTime = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function showStartScreen() {
    gameState = 'menu';
    stopBgm();
    showPanel(`<h2>${t('startTitle')}</h2>
      <p style="color:#F7931A;font-weight:600;margin-bottom:6px;">${t('startSub')}</p>
      <p>${t('startDesc')}</p>
      <p style="font-size:14px;color:#A78BFA;margin-top:10px;">${t('startHint')}</p>
      <p style="font-size:13px;color:#94A3B8;margin-top:12px;">${t('startCtrl')}</p>
      <button id="startBtn">${t('startBtn')}</button>`);
    document.getElementById('startBtn').onclick = () => { initSounds(); startGame(); };
  }

  // Boot
  updateMuteBtn();
  updateLangBtn();
  applyLang();
  showStartScreen();
  requestAnimationFrame(loop);
})();
</script>
